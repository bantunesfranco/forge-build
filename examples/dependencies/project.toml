[workspace]
name    = "dependencies"
version = "0.1.0"
c       = "17"

[profile.debug]
opt        = "none"
debug_info = true

[profile.release]
opt        = "speed"
debug_info = false

[dependency.math_utils]
path           = "../c-library"
kind           = "sources"
files          = ["src/math_utils.c"]
include.public = ["include"]
system.public  = ["math"]

[bin.dependencies]
sources = ["src/main.c"]
deps    = ["math_utils"]
