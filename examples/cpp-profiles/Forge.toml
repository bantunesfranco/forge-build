
[project]
name = "cpp-profiles"
version = "0.1.0"
authors = []

[build]
compiler = "clang++"
standard = "c++20"
source_dirs = ["src"]
output = "cpp-profiles"
default_profile = "debug"

[build.flags]
warnings = true
pedantic = true
include_dirs = ["include"]
defines = ["APP_NAME=\"Forge Example\""]

[profile.debug]
opt_level = 0
debug_info = true
defines = ["APP_DEBUG"]

[profile.release]
opt_level = 2
debug_info = false
defines = { add = ["NDEBUG"], remove = ["APP_DEBUG"] }

[profile.debug_release]
inherits = ["debug", "release"]
