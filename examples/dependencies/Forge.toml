
[project]
name = "dependencies"
version = "0.1.0"
authors = []

[build]
compiler = "clang++"
standard = "c++20"
source_dirs = ["src"]
output = "dependencies"
default_profile = "debug"

[build.flags]
warnings = true
pedantic = false
error_on_warning = false
include_dirs = ["include"]
libs = ["m"]

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 2
debug_info = false

# Pure system requirement: fail with a clear message if missing
[dependencies.zlib]
version = ">=1.2.11"
find = ["pkg-config:zlib"]

# System first, fall back to building from the web
[dependencies.fmt]
version = ">=10"
prefer = "system"                      # "system" | "vendored" | "system-only"
find = ["pkg-config:fmt", "cmake:fmt"]

[dependencies.fmt.source]
type = "git"
url = "https://github.com/fmtlib/fmt"
rev = "10.2.1"

[dependencies.fmt.build]
system = "cmake"
args = ["-DFMT_TEST=OFF", "-DBUILD_SHARED_LIBS=OFF"]

# Header-only, no build, manual exposure
[dependencies.glm]
[dependencies.glm.source]
type = "git"
url = "https://github.com/g-truc/glm"
rev = "1.0.1"
[dependencies.glm.build]
system = "none"
[dependencies.glm.expose]
include = ["."]

# Plain Makefile project with no install target and no .pc file
[dependencies.legacy]
[dependencies.legacy.source]
type = "tar"
url = "https://example.org/legacy-2.1.tar.gz"
sha256 = "..."
[dependencies.legacy.build]
system = "make"
args = ["CC={cc}", "-j{jobs}"]
[dependencies.legacy.expose]        # manual, relative to source dir
include = ["include"]
lib_dirs = ["."]
libs = ["legacy"]

# Dep that uses your own build system
[dependencies.mylib]
[dependencies.mylib.source]
type = "git"
url = "https://github.com/me/mylib"
rev = "v0.3.0"
[dependencies.mylib.build]
system = "self"                       # runs your tool recursively on its manifest