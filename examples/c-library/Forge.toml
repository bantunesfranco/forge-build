edition = "2026"

[package]
name = "c-library"
version = "0.1.0"

[lang]
c = "c17"

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 2
debug_info = false

[lib.math_utils]
sources = ["src/math_utils.c"]
include = { public = ["include"] }
system_libs = ["m"]

[bin.c-library]
sources = ["src/main.c"]
deps = ["math_utils"]
