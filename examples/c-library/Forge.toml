
[project]
name = "c-library"
version = "0.1.0"
authors = []

[build]
compiler = "clang"
standard = "c17"
source_dirs = ["src"]
output = "c-library"
default_profile = "debug"

[build.flags]
warnings = true
pedantic = true
error_on_warning = false
include_dirs = ["include"]
libs = ["m"]

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 2
debug_info = false
