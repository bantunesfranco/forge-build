edition = "2026"

[package]
name = "cpp-profiles"
version = "0.1.0"

[lang]
cxx = "c++20"

[profile.debug]
opt_level = 0
debug_info = true
defines = ["APP_DEBUG"]

[profile.release]
opt_level = 2
debug_info = false
defines = { add = ["NDEBUG"], remove = ["APP_DEBUG"] }

[profile.debug_release]
inherits = ["debug", "release"]

[build.flags]
defines = ["APP_NAME=\"Forge Example\""]

[bin.cpp-profiles]
sources = ["src/**/*.cpp"]
include = ["include"]
