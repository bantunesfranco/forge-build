[package]
name = "forge-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Simple C/C++ build system"
license = "MIT OR Apache-2.0"
authors = ["Bruno Franco <brunoantunesfranco@gmail.com>"]
repository = "https://github.com/bantunesfranco/forge-build"
homepage = "https://github.com/bantunesfranco/forge-build"
categories = ["development-tools::build-utils"]
readme = "README.md"
exclude = ["/.github"]

[lib]
name = "forge_build"
path = "src/lib.rs"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "cargo", "help", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
walkdir = "2.5.0"
serde_json = "1.0.154"
postcard = { version = "1.1.3", features = ["use-std"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true