name: Release

# A `v*` tag builds Forge for every platform, publishes the crate to
# crates.io, then publishes a GitHub Release with the archives attached. A tag
# with a pre-release suffix (`v0.2.0-rc.1`) and every 0.x version are
# GitHub pre-releases.
#
# crates.io needs the repository secret CARGO_REGISTRY_TOKEN (a token with the
# publish-update scope, or publish-new for the very first upload).
#
# A pull request that changes this file or Cargo.toml only builds the archives
# and runs `cargo publish --dry-run`, so the workflow is tested before a tag
# ever uses it.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.89"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an older glibc, so the binary runs on more distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="forge-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          if [ "${{ github.event_name }}" = pull_request ]; then name="forge-test-${{ matrix.target }}"; fi
          dir="dist/$name"
          mkdir -p "$dir"
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          cp "target/${{ matrix.target }}/release/forge$exe" "target/${{ matrix.target }}/release/forge-build$exe" "$dir/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md "$dir/"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -rf "$name"
          ls -l

      # Native builds only: the x86_64 macOS binary is cross-built on an arm64
      # runner and is not run here.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          "target/${{ matrix.target }}/release/forge$exe" --version
          "target/${{ matrix.target }}/release/forge-build$exe" --version

      - uses: actions/upload-artifact@v7
        with:
          name: forge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  crates-io:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Check the package
        run: cargo publish --locked --dry-run

      # Re-running a tag whose GitHub Release step failed must not fail here:
      # a version that crates.io already has is skipped.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the repository secret CARGO_REGISTRY_TOKEN is not set"
            exit 1
          fi
          name=$(grep -m1 '^name = ' Cargo.toml | cut -d'"' -f2)
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "$name release workflow" "https://crates.io/api/v1/crates/$name/$version")
          if [ "$status" = 200 ]; then
            echo "$name $version is already on crates.io; skipping"
            exit 0
          fi
          cargo publish --locked

  publish:
    name: Publish GitHub Release
    needs: [build, crates-io]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section is the lines after the exact heading `## <version>`.
          awk -v h="## $version" '
            $0 == h { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            v0.*|*-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Forge ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $prerelease
