edition = "2026"

[package]
name = "dependencies"
version = "0.1.0"

[lang]
c = "c17"

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 2
debug_info = false

[dependencies.math_utils]
path = "../c-library"
resolve = ["source"]
build = { type = "sources", files = ["src/math_utils.c"] }
expose = { include = ["include"], lib_dirs = ["lib"], libs = ["math_utils", "m"] }

[bin.dependencies]
sources = ["src/main.c"]
deps = ["math_utils"]
