
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel outdated runs for the same branch or pull-request ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          python3 --version
          clang --version
          clang++ --version
          gcc --version
          g++ --version
          ar --version 2>&1 | head -n 1 || true
          make --version 2>&1 | head -n 1 || true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --all-targets

      - name: Release tests
        run: cargo test --locked --release --all-targets

      - name: Documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build Forge
        run: cargo build --locked --release

      - name: Example and dependency integration tests
        run: python3 dev/test_examples.py

  coverage:
    name: Rust coverage (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate LCOV report
        run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info

      - name: SonarQube Cloud scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.rust.lcov.reportPaths=lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14
